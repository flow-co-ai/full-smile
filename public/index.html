<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Full Smile Dental | Practice report</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens from fullsmilechicago.com */
:root{--bg:#eef2fa;--card:#fff;--line:#dce8f4;--line2:#e8f0fa;--ink:#152449;--ink2:#25385c;--text:#1d2742;--text2:#51607a;--text3:#8491a7;
  --accent:#4da8d3;--cyan:#06aad7;--accbg:#eaf5fb;--good:#1f8a5b;--bad:#c24a33;--warn:#b7791f;--r:18px;--sh:0 10px 30px -18px rgba(21,36,73,.35);
  --font:'Urbanist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1{font-weight:700;letter-spacing:-.02em;color:var(--ink)}
h3{font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.cap{font-size:13px;color:var(--text3);margin-top:2px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent)}
/* shell */
#shell[hidden]{display:none}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px 20px}
.rb{padding:0 8px}.rb img{height:52px;width:auto;display:block}
.rb span{display:block;font-size:12px;font-weight:600;color:var(--text3);margin-top:10px;letter-spacing:.02em}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:4px}
.nav button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;text-align:left;padding:10px 12px;border-radius:12px}
.nav button b{display:block;font-weight:700;font-size:15.5px;color:var(--ink)}
.nav button small{display:block;font-size:12.5px;color:var(--text3)}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="page"]{background:var(--accbg)}
.nav button[aria-current="page"] b{color:var(--accent)}
.badge{font-style:normal;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:10px;padding:1px 8px}
.rf{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--text3);display:grid;gap:6px}
.lk{background:none;border:none;color:var(--accent);text-align:left;padding:0;font-size:12.5px;font-weight:600}
.main{min-width:0;padding:28px 34px 48px;max-width:1260px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.top h1{font-size:clamp(26px,2.7vw,38px);line-height:1.12;margin-top:6px;max-width:30ch}
.top .tag{font-size:17px;color:var(--text2);margin-top:6px;font-weight:500}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{background:none;border:none;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--text2);border-radius:9px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}.c3{grid-column:span 3}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;min-width:0;border:1px solid rgba(220,232,244,.6)}
.top2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}.top2>div:first-child{flex:1;min-width:0}.top2>.seg,.top2>button{flex:none}
.more{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;padding:8px 14px;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:10px}
.more:hover{background:var(--accbg)}
.banner{background:#fff8eb;border:1px solid #f3dcae;color:#7a5314;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14.5px}
/* KPI band */
.navy{background:var(--ink);border-radius:var(--r);margin-bottom:16px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;text-align:left;background:none;border:none;color:#fff;padding:20px 20px 18px;border-left:1px solid rgba(255,255,255,.09);min-width:0;font:inherit}
.kpi:first-child{border-left:none}
button.kpi:hover{background:rgba(255,255,255,.04)}
.kpi b{font-size:clamp(24px,2.3vw,32px);font-weight:700;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
.kpi span{font-size:12.5px;font-weight:600;color:#9fd0e7;margin-top:6px}
.kpi em{font-style:normal;font-size:12.5px;margin-top:4px;color:#aab6cc;min-height:17px}.kpi em.good{color:#8fe0b5}.kpi em.bad{color:#ffb3a1}
.kpi svg{display:block;margin-top:10px;width:100%;height:26px}
/* bars and rows */
.b2{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px;width:100%;background:none;border:none;text-align:left}
.b2 .t{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}
.b2 .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.b2 .t i.n{background:var(--ink2)}.b2 .t i.u{background:#c7d3e3}
.b2 b{text-align:right;font-weight:700}
.b2.bt:hover span:first-child{color:var(--accent)}
.kv3{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:12px}
.kv3 b{display:block;font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.kv3 span{font-size:12.5px;color:var(--text3)}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.line:last-child{border-bottom:none}.line b{font-weight:700;color:var(--ink)}
/* channel table */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid rgba(220,232,244,.6)}
.ch-h,.ch-r{display:grid;grid-template-columns:minmax(170px,1.5fr) 84px 60px 66px 90px 96px 118px;gap:12px;align-items:center;padding:0 22px}
.ch-h{font-size:12px;font-weight:700;color:var(--text3);padding-top:14px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.ch-h .r,.ch-r .r{text-align:right}
.ch-r{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding-top:12px;padding-bottom:12px}
.ch-r:last-of-type{border-bottom:none}.ch-r:hover{background:#f7faff}
.ch-r .nm{font-weight:700;color:var(--ink)}.ch-r .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--text3)}
.ch-r .muted{color:var(--text3)}.ch-r .np{font-weight:700}
.ch-r .cost{text-align:right;font-size:20px;font-weight:800;color:var(--accent)}
.ch-r .cost small{display:block;font-size:11.5px;font-weight:500;color:var(--text3)}
.foot{padding:11px 22px 13px;font-size:13px;color:var(--text3);border-top:1px solid var(--line2);background:#fafcff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}
/* reputation */
.rk-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--text2)}
.rk-legend span{display:flex;gap:8px;align-items:baseline;min-width:0}
.rk-legend i{flex:none;width:14px;height:3px;border-radius:2px;display:inline-block;transform:translateY(-3px)}
.rk-legend b{font-weight:800;color:var(--ink);white-space:nowrap}
.rk-legend em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--good)}.down{color:var(--bad)}
.stat2{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding:11px 0}
.stat2:last-child{border-bottom:none}
.stat2 .v{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat2 b{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.stat2 span{font-size:13px;color:var(--text2)}
.stat2 em,.ig4 em{font-style:normal;font-size:12.5px;font-weight:600}.good{color:var(--good)}.bad{color:var(--bad)}
.stat2 svg{display:block;width:100%;height:22px;margin-top:6px}
.ig4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 4px}
.ig4 b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.ig4 span{display:block;font-size:12.5px;color:var(--text3)}
svg.mbars{display:block;width:100%;height:70px}
.post{display:grid;grid-template-columns:minmax(0,1fr) 64px 60px 110px;align-items:baseline;gap:0 12px;padding:8px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.post:last-child{border-bottom:none}.post:hover .pt{color:var(--accent)}
.post .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post .pd{font-size:12px;color:var(--text3)}
.post b{font-size:18px;font-weight:800;text-align:right;color:var(--ink)}.post > small{text-align:right;color:var(--text3);font-size:12px}
/* attention */
.att{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;border-top:4px solid var(--accent)}
.att.hot{border-top-color:var(--bad)}.att.warn{border-top-color:var(--warn)}
.att:hover{background:#fbfdff}
.att b{font-size:19px;font-weight:800;line-height:1.25;color:var(--ink)}
.att p{font-size:14px;color:var(--text2);margin:0}
.att .go2{font-size:13px;color:var(--accent);font-weight:700;margin-top:auto;padding-top:8px}
/* sidebar */
#scrim{position:fixed;inset:0;background:rgba(21,36,73,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#side{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--card);visibility:hidden;transform:translateX(100%);transition:transform .22s;z-index:31;overflow-y:auto}
body.open #scrim{opacity:1;pointer-events:auto}body.open #side{transform:none;visibility:visible;box-shadow:-20px 0 50px -30px rgba(21,36,73,.5)}
.sh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;gap:12px;align-items:flex-start}
.sh .t{flex:1;min-width:0}.sh h2{font-size:24px;font-weight:800;color:var(--ink);line-height:1.15}.sh .k{font-size:13.5px;color:var(--text3);margin-top:3px}
.sh button{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;flex:none}.sh .x{width:34px}.sh .back{padding:0 11px;font-size:13px}
.sb{padding:6px 24px 44px}
.read{margin-top:16px;font-size:16px;line-height:1.6}
.sb h4{font-size:17px;font-weight:800;color:var(--ink);margin:24px 0 8px}
.sb p.s{font-size:14px;color:var(--text2);margin:6px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.kv div{background:var(--bg);border-radius:12px;padding:12px 14px}
.kv b{display:block;font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}.kv span{font-size:12.5px;color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:700;color:var(--text3);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line2);color:var(--text2)}td:first-child{color:var(--ink);font-weight:600}
.n{text-align:right;white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td{background:#f7faff}
/* lock */
#lock{max-width:380px;margin:14vh auto 0;padding:0 24px;text-align:center}
#lock img{height:88px}#lock h1{margin:22px 0 6px;font-size:28px}#lock p{color:var(--text2)}
#lock input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;width:100%;margin:22px 0 12px;background:#fff;text-align:center}
#lock .go{width:100%;font-weight:700;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:none}.kpi:nth-child(n+4){border-top:1px solid rgba(255,255,255,.09)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto}
  .rb img{height:32px}.rb span{display:none}.rf{display:none}
  .nav{flex-direction:row;margin:0}.nav button{padding:8px 10px;white-space:nowrap}.nav button small{display:none}
  .main{padding:18px 14px 40px}.top{flex-direction:column}
  .c8,.c4,.c6,.c3{grid-column:span 12}.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}.kpi{border-left:none !important;border-top:1px solid rgba(255,255,255,.09)}.kpi:nth-child(-n+2){border-top:none}
  .ch-h{display:none}.ch-r{grid-template-columns:1fr auto;row-gap:4px}.ch-r .hide{display:none}
  .ig4{grid-template-columns:1fr 1fr}.rk-legend{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#scrim,#side{transition:none}}

/* ---- v2 additions ---- */
.rk{display:grid;grid-template-columns:52px minmax(0,1fr) 130px 90px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.rk>b{font-size:20px;font-weight:800;color:var(--text2);text-align:right}.rk>b.p1{color:var(--accent)}
.rk span{font-size:14.5px;font-weight:600;color:var(--ink);min-width:0}.rk small{display:block;font-size:12px;color:var(--text3);font-weight:500}
.rk em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--text3);text-align:right}.rk em.up{color:var(--good)}.rk em.down{color:var(--bad)}
@media (max-width:860px){.rk{grid-template-columns:44px 1fr 90px}.rk svg{display:none}}
.nav button{padding:9px 12px}
.brief{align-self:end}
.brief p{padding:0 0 0 12px;border-left:3px solid var(--line);color:var(--text2);margin:0 0 10px;font-size:14.5px;max-width:62ch}
.brief p.key{border-color:var(--accent);color:var(--ink)}.brief p.warn{border-color:var(--warn)}.brief p.hot{border-color:var(--bad);color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:18px}
.hero h1{font-size:clamp(28px,3.1vw,42px);line-height:1.08;max-width:20ch}
.hero .tag{font-size:17px;color:var(--text2);margin-top:8px;font-weight:500}
.kpi .tgt{font-size:11.5px;color:#7f93b3;margin-top:2px}
/* patient bridge */
.bridge-sum{display:flex;align-items:stretch;gap:0;margin:12px 0 4px;flex-wrap:wrap}
.bridge-sum div{padding:4px 12px 4px 0;margin-right:12px}
.bridge-sum div:last-child{border-right:none}
.bridge-sum b{display:block;font-size:24px;font-weight:800;color:var(--ink);line-height:1.1}
.bridge-sum b.up{color:var(--good)}.bridge-sum b.down{color:var(--bad)}
.bridge-sum span{font-size:12.5px;color:var(--text3)}
.bridge-sum .op{align-self:center;padding:0 12px 14px 0;margin-right:0;font-size:20px;color:var(--text3);font-weight:700}
/* today */
.titem{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding:11px 0;align-items:baseline}
.titem:last-of-type{border-bottom:none}
.titem b{font-size:22px;font-weight:800;color:var(--ink);min-width:44px;text-align:right}
.titem b.hot{color:var(--bad)}.titem b.warn{color:var(--warn)}
.titem span{font-size:14px;color:var(--text);font-weight:600}
.titem small{grid-column:2;font-size:12.5px;color:var(--text3)}
button.titem:hover span{color:var(--accent)}
/* mini cards */
.mini{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini h3{font-size:15px}
.mini .big{font-size:30px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:4px}
.mini p{font-size:13.5px;color:var(--text2)}
.mini svg{display:block;width:100%;height:34px;margin-top:8px}
.mini .go2{font-size:13px;color:var(--accent);font-weight:700;margin-top:auto;padding-top:10px}
/* bars, targets */
.b3{display:grid;grid-template-columns:minmax(130px,230px) 1fr 70px;gap:12px;align-items:center;padding:7px 0;font-size:14px;width:100%;background:none;border:none;text-align:left}
.b3 .t{position:relative;height:12px;background:var(--line2);border-radius:6px}
.b3 .t i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.b3 .t i.n{background:var(--ink2)}.b3 .t i.g{background:#8fcbe6}
.b3 b{text-align:right;font-weight:700}
.b3 small{display:block;font-size:11.5px;color:var(--text3);font-weight:500}
button.b3:hover>span:first-child{color:var(--accent)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.meter{position:relative;height:14px;background:var(--line2);border-radius:7px;margin:14px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent)}
.meter .band{position:absolute;top:0;bottom:0;background:rgba(31,138,91,.14);border-left:2px solid var(--good);border-right:2px solid var(--good)}
.meter .tk{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--good)}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}
.bigv{font-size:34px;font-weight:800;color:var(--ink);line-height:1.1;margin-top:10px}
.bigv small{font-size:14px;color:var(--text2);font-weight:600;margin-left:6px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:12px 0 8px}
.stack i{display:block;height:100%}.stack i+i{box-shadow:inset 1px 0 0 rgba(255,255,255,.8)}
/* funnel */
.fun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:14px}
.fun div{padding:10px 14px 10px 0;position:relative}
.fun div+div{padding-left:18px;border-left:1px solid var(--line2)}
.fun b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.fun span{display:block;font-size:12.5px;color:var(--text2);margin-top:3px}
.fun em{display:block;font-style:normal;font-size:12px;color:var(--accent);font-weight:700;margin-top:4px}
/* where to act */
.act{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:none}
.act>b{font-size:30px;font-weight:800;color:var(--ink);text-align:right;line-height:1}
.act>b.hot{color:var(--bad)}.act>b.warn{color:var(--warn)}
.act h4{font-size:16px;font-weight:700;color:var(--ink)}
.act p{font-size:13.5px;color:var(--text2);margin-top:2px;max-width:70ch}
.act .do{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{display:inline-block;font-size:13.5px;font-weight:700;padding:8px 14px;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:10px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accbg)}
.od{font-size:12.5px;color:var(--text3);white-space:nowrap}.od b{color:var(--ink2);font-weight:700}
.sb .od{display:block;margin-top:14px;white-space:normal}

<body>

<aside id="side" aria-hidden="true" aria-labelledby="st"><div class="sh"><button class="back" id="sback" hidden>Back</button><div class="t"><h2 id="st"></h2><div class="k" id="sk"></div></div><button class="x" id="sx" aria-label="Close">✕</button></div><div class="sb" id="sbody"></div></aside>

<script>

// ---------- helpers
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const $ = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n || 0)).toLocaleString();
const $k = n => (Math.abs(n) >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : Math.abs(n) >= 1e4 ? `$${Math.round(n / 1e3)}K` : $(n));
const n0 = v => (v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString());
const pct = v => (v == null || isNaN(v) || !isFinite(v) ? '—' : `${Math.round(v * 100)}%`);
const dl = d => { if (!d) return '—'; const [, m, dd] = d.split('-'); return `${MO[+m - 1]} ${+dd}`; };
const ml = m => `${MO[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
const ms = m => MO[+m.slice(5, 7) - 1];
const shift = (d, n) => { const x = new Date(`${d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const monday = d => { const x = new Date(`${d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10); };
const pl = (n, a, b) => `${Math.round(n).toLocaleString()} ${Math.round(n) === 1 ? a : (b || a + 's')}`;
const sum = (a, f) => a.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f] || 0), 0);
const per = (a, b) => (a != null && b ? a / b : null);
const median = a => { const v = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : null; };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const dim = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate();
const days = (a, b) => Math.round((new Date(`${b}T12:00:00Z`) - new Date(`${a}T12:00:00Z`)) / 864e5) + 1;

const CHS = [
  ['gbp', 'Google profile', '#06aad7'], ['website', 'Website', '#4da8d3'], ['referral', 'Referrals and word of mouth', '#2f8f9d'],
  ['google_any', 'Google (from OpenDental)', '#7d93b8'], ['phone', 'Phone call, source unknown', '#b4c2d6'],
  ['meta', 'Meta ads', '#3e5a8c'], ['lsa', 'Google LSA', '#152449'], ['google_ads', 'Google Search Ads', '#5b6f96'],
  ['other', 'Other', '#cfd8e6'], ['unknown', 'No source in GHL', '#dde4ee'], ['not_in_ghl', 'Not in GHL', '#e6ebf2'],
];
const CH = Object.fromEntries(CHS.map(([k, label, color]) => [k, { k, label, color, paid: ['meta', 'lsa', 'google_ads'].includes(k) }]));
const chLabel = k => CH[k]?.label || k;
const CATS = { prev: 'Exams and cleanings', perio: 'Gum care', fill: 'Fillings', crown: 'Crowns and bridges', endo: 'Root canals', implant: 'Implants', denture: 'Dentures', surgery: 'Extractions and surgery', sleep: 'Sleep apnea', ortho: 'Orthodontics', other: 'Other' };
const BIG = ['implant', 'crown', 'endo', 'denture', 'sleep', 'surgery', 'perio'];
const catOf = c => { c = String(c || '').toUpperCase();
  if (/^D994[7-9]/.test(c)) return 'sleep'; if (/^D[01]/.test(c)) return 'prev'; if (/^D4/.test(c)) return 'perio'; if (/^D2[1-6]/.test(c)) return 'fill';
  if (/^D27/.test(c) || /^D6[2-7]/.test(c)) return 'crown'; if (/^D3/.test(c)) return 'endo'; if (/^D6[01]/.test(c)) return 'implant';
  if (/^D5/.test(c)) return 'denture'; if (/^D7/.test(c)) return 'surgery'; if (/^D8/.test(c)) return 'ortho'; return 'other'; };
const PROPHY = ['D1110'], PERIO = ['D4341', 'D4342', 'D4346', 'D4910', 'D4355'];
const AGES = [['a30', 'Under 30 days'], ['a90', '1 to 3 months'], ['a180', '3 to 6 months'], ['a365', '6 to 12 months'], ['old', '12 to 18 months']];
const CLAIMB = [['unsent', 'Not sent yet'], ['d30', 'Sent, under 30 days'], ['d60', '30 to 60 days'], ['d90', '60 to 90 days'], ['old', 'Over 90 days']];
// Common industry targets, shown as a tick. They are rules of thumb, not guarantees.
const TGT = { coll: 0.98, rebook: 0.85, perio: 0.3, hygShare: [0.25, 0.33], show: 0.9 };
// Where the matching list lives in OpenDental (desktop software, so no links).
const OD = { recall: 'Lists › Recall', unsched: 'Lists › Unscheduled', tx: 'Reports › Standard › Treatment Finder', aging: 'Reports › Standard › Aging of A/R',
  claims: 'Reports › Standard › Outstanding Insurance Claims', send: 'Manage › Send Claims', prod: 'Reports › Standard › Production and Income',
  np: 'Reports › Standard › New Patients', broken: 'Reports › Standard › Broken Appointments' };
const odp = k => `<span class="od">In OpenDental: <b>${OD[k]}</b></span>`;

let D;
const S = { win: 'mtd', tab: 'pulse', stack: [], rankAll: false };
const P = () => D.practice;
const PR = () => D.practice?.practice;
const V2 = () => (D.practice?.version || 1) >= 2;

// ---------- ranges
const inR = (d, r) => d >= r[0] && d <= r[1];
// Weekly totals from the droplet: a week counts when most of it falls in the range.
const wkIn = (wk, r) => wk >= shift(r[0], -3) && wk <= shift(r[1], -3);
// Monthly totals: weighted by how many of the month's days fall in the range.
const mw = (m, r) => { const a = `${m}-01`, b = `${m}-${String(dim(m)).padStart(2, '0')}`; const lo = a > r[0] ? a : r[0], hi = b < r[1] ? b : r[1]; return lo > hi ? 0 : days(lo, hi) / dim(m); };
function months12() { const out = []; let m = D.today.slice(0, 7); for (let i = 0; i < 12; i++) { out.unshift(m); const x = new Date(`${m}-15T12:00:00Z`); x.setUTCMonth(x.getUTCMonth() - 1); m = x.toISOString().slice(0, 7); } return out; }
function weeks12() { const m = monday(D.today); return Array.from({ length: 12 }, (_, i) => { const f = shift(m, -7 * (11 - i)); return [f, shift(f, 6)]; }); }
const mRange = m => [`${m}-01`, `${m}-${String(dim(m)).padStart(2, '0')}`];

function delta(cur, prev, lowerBetter, count) {
  if (cur == null || prev == null || !hasPrior()) return '';
  if (count && prev < 5) return prev === cur ? `<em>Same as ${priorWords()}</em>` : `<em class="${(cur > prev) !== !!lowerBetter ? 'good' : 'bad'}">${cur > prev ? '▲' : '▼'} from ${n0(prev)} in ${priorWords()}</em>`;
  if (!prev) return '';
  const ch = (cur - prev) / Math.abs(prev); if (Math.abs(ch) < 0.03) return `<em>Flat vs ${priorWords()}</em>`;
  return `<em class="${(ch < 0) === !!lowerBetter ? 'good' : 'bad'}">${ch > 0 ? '▲' : '▼'} ${Math.round(Math.abs(ch) * 100)}% vs ${priorWords()}</em>`;
}
const ptDelta = (cur, prev) => (cur == null || prev == null || !hasPrior() ? '' : Math.abs(cur - prev) < 0.01 ? `<em>Flat vs ${priorWords()}</em>` : `<em class="${cur > prev ? 'good' : 'bad'}">${cur > prev ? '▲' : '▼'} ${Math.round(Math.abs(cur - prev) * 100)} pts vs ${priorWords()}</em>`);
function kspark(vals, color = '#9fd0e7', w = 160, h = 26) {
  const v = vals.map(x => x ?? 0), mx = Math.max(1e-9, ...v), step = w / Math.max(1, v.length - 1), y = x => (h - 3 - x / mx * (h - 6)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${v.map((x, i) => `${(i * step).toFixed(1)},${y(x)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function sparkMM(vals, color, w = 240, h = 34) {
  const v = vals.filter(x => x != null); if (v.length < 2) return ''; const lo = Math.min(...v), hi = Math.max(...v), rg = Math.max(1, hi - lo), step = w / (v.length - 1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px" aria-hidden="true"><polyline points="${v.map((x, i) => `${(i * step).toFixed(1)},${(h - 4 - (x - lo) / rg * (h - 8)).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg><div class="mlab"><span>${n0(v[0])}</span><span>${n0(v[v.length - 1])} today</span></div>`;
}
function minibars(vals, color = '#4da8d3', last = '#152449') {
  const mx = Math.max(1e-9, ...vals), bw = 240 / vals.length;
  return `<svg viewBox="0 0 240 34" preserveAspectRatio="none" aria-hidden="true">${vals.map((v, i) => `<rect x="${i * bw + bw * .15}" y="${34 - v / mx * 32}" width="${bw * .7}" height="${v / mx * 32}" rx="2" fill="${i === vals.length - 1 ? last : color}"/>`).join('')}</svg>`;
}

// ---------- the numbers
function practiceIn(r) {
  const p = PR(); if (!p) return null;
  const Dd = p.daily.filter(x => inR(x[0], r)), done = sum(Dd, x => x[4]), broken = sum(Dd, x => x[5]);
  const wo = sum(p.carriers || [], x => x[4] * mw(x[0], r));
  const prod = sum(Dd, x => x[1]), coll = sum(Dd, x => x[2] + x[3]);
  return { prod, coll, collPat: sum(Dd, x => x[2]), collIns: sum(Dd, x => x[3]), done, broken, show: done + broken ? done / (done + broken) : null,
    np: sum(Dd, x => x[7]), wo, collRate: p.carriers ? per(coll, prod - wo) : null };
}
const npRows = r => (V2() ? P().newPatients.filter(x => wkIn(x[0], r)) : []);
function sourcesIn(r) {
  const out = {};
  for (const x of npRows(r)) { const t = (out[x[1]] ||= { k: x[1], np: 0, coll: 0, prod: 0, plan: 0, ret: 0, leads: 0, booked: 0 }); t.np += x[3]; t.coll += x[4]; t.prod += x[5]; t.plan += x[6]; t.ret += x[7] || 0; }
  if (P()) for (const [wk, ch, n, booked] of P().leads.weeks) if (wkIn(wk, r)) { const t = (out[ch] ||= { k: ch, np: 0, coll: 0, prod: 0, plan: 0, ret: 0, leads: 0, booked: 0 }); t.leads += n; t.booked += booked; }
  return Object.values(out).map(x => ({ ...x, ...CH[x.k] })).filter(x => x.np || x.leads).sort((a, b) => b.np - a.np || b.leads - a.leads);
}
function provsIn(r) {
  const p = PR(), out = {}; if (!p) return [];
  const info = p.providerInfo || Object.fromEntries(Object.entries(p.providers || {}).map(([k, v]) => [k, { name: v, hygienist: false }]));
  for (const [wk, pv, amt] of p.prodProv) if (wkIn(wk, r)) (out[pv] ||= { k: pv, prod: 0, days: 0, pats: 0, dayProd: 0 }).prod += amt;
  for (const [m, pv, amt, dd, pats] of p.provDays || []) { const w = mw(m, r); if (!w) continue; const t = (out[pv] ||= { k: pv, prod: 0, days: 0, pats: 0, dayProd: 0 }); t.days += dd * w; t.pats += pats * w; t.dayProd += amt * w; }
  return Object.values(out).filter(x => x.prod > 0).map(x => ({ ...x, name: info[x.k]?.name || `Provider ${x.k}`, hyg: !!info[x.k]?.hygienist, perDay: x.days >= 1 ? x.dayProd / x.days : null })).sort((a, b) => b.prod - a.prod);
}
function catsIn(r) { const out = {}; for (const [wk, c, a, n] of PR()?.prodCat || []) if (wkIn(wk, r)) { const t = (out[c] ||= { k: c, amt: 0, n: 0 }); t.amt += a; t.n += n; } return Object.values(out).sort((a, b) => b.amt - a.amt); }
function codesIn(r, cat) { const out = {}; for (const [m, code, d, n, amt] of PR()?.codes || []) { const w = mw(m, r); if (!w || (cat && catOf(code) !== cat)) continue; const t = (out[code] ||= { code, d, n: 0, amt: 0 }); t.n += n * w; t.amt += amt * w; } return Object.values(out).sort((a, b) => b.amt - a.amt); }
function txIn(r) { const out = {}; for (const [m, c, done, sched, open, pats] of PR()?.tx || []) { const w = mw(m, r); if (!w) continue; const t = (out[c] ||= { k: c, done: 0, sched: 0, open: 0, pats: 0 }); t.done += done * w; t.sched += sched * w; t.open += open * w; t.pats += pats * w; } return Object.values(out).map(x => ({ ...x, planned: x.done + x.sched + x.open, moving: x.done + x.sched })).sort((a, b) => b.planned - a.planned); }
function hygIn(r) { const h = (PR()?.hygiene || []).filter(x => wkIn(x[0], r)); const n = sum(h, x => x[1]), rb = sum(h, x => x[2]); return { n, rebooked: rb, rate: n ? rb / n : null }; }
function perioIn(r) { const c = codesIn(r), pro = sum(c.filter(x => PROPHY.includes(x.code)), 'n'), pe = sum(c.filter(x => PERIO.includes(x.code)), 'n'); return { prophy: pro, perio: pe, share: pro + pe ? pe / (pro + pe) : null }; }
function hygShareIn(r) { const ps = provsIn(r); if (!ps.some(x => x.hyg)) return null; const tot = sum(ps, 'prod'); return tot ? sum(ps.filter(x => x.hyg), 'prod') / tot : null; }
function carriersIn(r) { const out = {}; for (const [m, car, billed, paid, wo, n] of PR()?.carriers || []) { const w = mw(m, r); if (!w) continue; const t = (out[car] ||= { k: car, billed: 0, paid: 0, wo: 0, n: 0 }); t.billed += billed * w; t.paid += paid * w; t.wo += wo * w; t.n += n * w; } return Object.values(out).filter(x => x.billed > 0 || x.paid > 0).map(x => ({ ...x, woRate: x.billed ? x.wo / x.billed : null })).sort((a, b) => b.billed - a.billed); }
function chairAhead() {
  const p = PR(); if (!p?.booked) return null;
  const w0 = monday(D.today), wks = [0, 1, 2, 3].map(i => shift(w0, 7 * i)), info = p.providerInfo || {};
  const rows = {};
  for (const [wk, pv, hrs] of p.booked) if (wks.includes(wk)) (rows[pv] ||= { k: pv, booked: 0, sched: 0 }).booked += hrs;
  for (const [wk, pv, hrs] of p.sched || []) if (wks.includes(wk)) (rows[pv] ||= { k: pv, booked: 0, sched: 0 }).sched += hrs;
  const list = Object.values(rows).filter(x => x.booked || x.sched).map(x => ({ ...x, name: info[x.k]?.name || `Provider ${x.k}`, hyg: !!info[x.k]?.hygienist, fill: x.sched ? x.booked / x.sched : null })).sort((a, b) => b.sched - a.sched || b.booked - a.booked);
  return { list, hasSched: list.some(x => x.sched), from: wks[0], to: shift(wks[3], 6) };
}
function weekdayIn(r) { const out = [0, 1, 2, 3, 4, 5, 6].map(i => ({ i, done: 0, broken: 0 })); for (const x of PR()?.daily || []) if (inR(x[0], r)) { const w = (new Date(`${x[0]}T12:00:00Z`).getUTCDay() + 6) % 7; out[w].done += x[4]; out[w].broken += x[5]; } return out.filter(x => x.done + x.broken > 0).map(x => ({ ...x, rate: x.broken / (x.done + x.broken) })); }
const DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const histReady = () => { const f = PR()?.firstRecord; if (!f) return false; const x = new Date(`${f}T12:00:00Z`); x.setUTCMonth(x.getUTCMonth() + 18); return x.toISOString().slice(0, 10) <= D.today; };
const fullFrom = () => { const f = PR()?.firstRecord; if (!f) return null; const x = new Date(`${f}T12:00:00Z`); x.setUTCMonth(x.getUTCMonth() + 18); return x.toISOString().slice(0, 7); };
function bridge() {
  const p = PR(); if (!p?.activeMonthly?.length || !histReady()) return null;
  const am = p.activeMonthly.slice(-13), rows = [];
  for (let i = 1; i < am.length; i++) {
    const m = am[i][0].slice(0, 7), nw = sum(p.daily.filter(x => x[0].startsWith(m)), x => x[7]), net = am[i - 1][1] + nw - am[i][1];
    rows.push({ m, active: am[i][1], nw, lapsed: Math.max(0, net), back: Math.max(0, -net) });
  }
  return { start: am[0][1], startM: am[0][0].slice(0, 7), end: am[am.length - 1][1], rows, nw: sum(rows, 'nw'), lapsed: sum(rows, 'lapsed'), back: sum(rows, 'back') };
}
const snap = () => PR()?.snapshot || {};
const ghlLink = kind => { const g = D.ghl || {}; if (!g.location) return D.ghlUrl || ''; const path = { opps: 'opportunities/list', convo: 'conversations/conversations', contacts: 'contacts/smart_list/All' }[kind] || 'opportunities/list'; return `${g.base}/v2/location/${encodeURIComponent(g.location)}/${path}`; };
const ghlBtn = (kind, label) => { const u = ghlLink(kind); return u ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : `<span class="od">In GHL: <b>${kind === 'convo' ? 'Conversations' : 'Opportunities'}</b></span>`; };
const soon = what => `<div class="soon">${what} appears after the droplet's next update.</div>`;

// ---------- follow-ups: everything that needs a person, with where to do it
function followups() {
  const out = [], p = P(), wt = p?.leads.waiting || {}, s = snap(), cl = PR()?.claims || [];
  const push = (sev, n, title, why, act) => { if (n) out.push({ sev, n, title, why, act }); };
  push('hot', wt.untouched, 'New leads not contacted after a day', 'Leads from the last 30 days still in the first stage in GHL. The first call decides most bookings.', ghlBtn('opps', 'Open in GHL'));
  push('warn', s.brokenNotRebooked, 'Missed visits not rebooked', 'Broken appointments in the last 60 days with nothing booked since.', odp('unsched'));
  push('warn', wt.contactedNotBooked, 'Leads reached but not booked', 'Contacted in the last 30 days with no appointment yet.', ghlBtn('opps', 'Open in GHL'));
  push('', s.recallOverdue, 'Patients overdue for a cleaning', `Recall due and not booked. ${n0(s.recallDue30)} more come due in the next 30 days.`, odp('recall'));
  if (s.unschedAmount) push('', s.unschedPatients, `Patients with ${$k(s.unschedAmount)} of treatment not scheduled`, 'Diagnosed in the last 18 months with no appointment. The most recent plans are the easiest to book.', `<button class="btn" data-tab="money">See treatment</button>${odp('tx')}`);
  const old = cl.filter(x => ['d90', 'old'].includes(x[0])), unsent = cl.find(x => x[0] === 'unsent');
  if (old.length) push('warn', sum(old, x => x[1]), `Insurance claims unpaid past 60 days, ${$k(sum(old, x => x[2]))}`, 'Sent and still waiting on the insurer. Worth a call or a resubmission.', odp('claims'));
  if (unsent) push('warn', unsent[1], `Claims not sent yet, ${$k(unsent[2])}`, 'Created but never sent, so the clock has not started.', odp('send'));
  if (s.ar90 > 500) out.push({ sev: '', n: $k(s.ar90), title: 'Patient balances older than 90 days', why: `Of ${$k(s.arTotal)} owed by patients in total.`, act: odp('aging') });
  const lowRev = (D.gbp?.reviews?.list || []).filter(x => x[1] && x[1] <= 3 && x[0] >= shift(D.today, -90));
  push('warn', lowRev.length, 'Low Google reviews in the last 90 days', lowRev.length ? `Most recent: ${lowRev[lowRev.length - 1][1]} stars on ${dl(lowRev[lowRev.length - 1][0])}. A calm reply on Google helps the next reader.` : '', `<a class="btn" href="https://business.google.com/reviews" target="_blank" rel="noopener">Reply on Google</a>`);
  return out;
}

// ---------- briefing: the three things most worth saying
function findings() {
  const r = range(), T = practiceIn(r), s = snap(), out = [];
  if (!T) return out;
  const h = hygIn(r), tx = txIn(r), b = bridge();
  if (T.collRate != null && T.collRate < TGT.coll - 0.03) out.push(['hot', `Collections are ${pct(T.collRate)} of what was produced after write-offs. The usual target is 98%.`, 3]);
  if (h.rate != null && h.rate < TGT.rebook - 0.05) out.push(['hot', `${pct(h.rate)} of hygiene patients have their next visit booked. Practices aim for 85% or more, and each miss becomes a recall to chase.`, 3]);
  if (T.show != null && T.show < 0.85) out.push(['warn', `${pl(T.broken, 'appointment')} broke ${rangeWords()}, ${pct(1 - T.show)} of the schedule.`, 2.5]);
  if (s.unschedAmount) { const top = [...(PR().unschedAge || []).reduce((m, [, c, a]) => m.set(c, (m.get(c) || 0) + a), new Map())].sort((a, b) => b[1] - a[1])[0];
    out.push(['key', `${$k(s.unschedAmount)} of diagnosed treatment is waiting to be scheduled for ${pl(s.unschedPatients, 'patient')}${top ? `, most of it ${CATS[top[0]]?.toLowerCase()}` : ''}.`, 2]); }
  const planned = sum(tx, 'planned'); if (planned > 5000) out.push(['', `${pct(sum(tx, 'moving') / planned)} of treatment planned ${rangeWords()} is scheduled or done.`, 1.5]);
  if (b && b.end !== b.start) out.push([b.end > b.start ? 'key' : 'warn', `Active patients ${b.end > b.start ? 'grew' : 'fell'} from ${n0(b.start)} to ${n0(b.end)} over the year: ${n0(b.nw)} new, ${n0(b.lapsed)} lapsed.`, 1.8]);
  if (s.recallOverdue > 100) out.push(['', `${n0(s.recallOverdue)} patients are overdue for a cleaning.`, 1.2]);
  const m = months12(), br = m.map(x => sum(PR().daily.filter(d => d[0].startsWith(x)), d => d[5]));
  const i = br.length - 2; if (i > 0 && br[i] > 2 * Math.max(10, br[i - 1])) out.push(['warn', `Broken appointments jumped to ${br[i]} in ${ms(m[i])} from ${br[i - 1]} in ${ms(m[i - 1])}. Worth checking whether the calendar sync is marking them.`, 2.8]);
  return out.sort((a, b) => b[2] - a[2]).slice(0, 3);
}

// ---------- ranges: owners think in months
const prevM = m => { const x = new Date(`${m}-15T12:00:00Z`); x.setUTCMonth(x.getUTCMonth() - 1); return x.toISOString().slice(0, 7); };
const mName = m => MO[+m.slice(5, 7) - 1];
const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const mFull = m => monthNames[+m.slice(5, 7) - 1];
function range() {
  const y = shift(D.today, -1);
  if (S.win === 'mtd') { const a = `${D.today.slice(0, 7)}-01`; return a > y ? [`${y.slice(0, 7)}-01`, y] : [a, y]; }
  if (S.win === 'last') return mRange(prevM(D.today.slice(0, 7)));

}
function prior() {

  if (S.win === 'last') return mRange(prevM(a.slice(0, 7)));
  return [shift(a, -S.win), shift(a, -1)];
}
const hasPrior = () => P() && prior()[0] >= P().window[0];
const rangeWords = () => ({ mtd: 'so far this month', last: `in ${mFull(range()[0])}`, 90: 'in the last 90 days', 365: 'in the last 12 months' })[S.win];

// Month-to-date pace: straight-line to month end, against last month's full total.
function pace(key) {
  if (S.win !== 'mtd') return '';
  const [a, b] = range(), m = a.slice(0, 7), el2 = days(a, b), full = practiceIn(mRange(prevM(m)))[key], cur = practiceIn(range())[key];

async function decrypt(pkg, pass) {
  const enc = new TextEncoder(), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(pkg.salt), iterations: pkg.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(pkg.iv) }, key, b(pkg.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function boot() {

  try { const r = await fetch('data.enc.json', { cache: 'no-store' }); if (!r.ok) throw 0; pkg = await r.json(); } catch { return fail('The dashboard data is not published yet. Check the GitHub Actions run.'); }
  const saved = sessionStorage.getItem('fsk');
  if (saved) { try { return start(await decrypt(pkg, saved)); } catch { sessionStorage.removeItem('fsk'); } }
  el('gate').innerHTML = `<div id="lock"><img src="fullsmile-logo.png" alt="Full Smile Dental"><h1>Practice report</h1><p>Enter the password to open the dashboard.</p>

  const tryIt = async () => { try { const d = await decrypt(pkg, el('pw').value); sessionStorage.setItem('fsk', el('pw').value); start(d); } catch { el('err').textContent = 'That password did not work. Check it and try again.'; } };
  el('go').onclick = tryIt; el('pw').onkeydown = e => { if (e.key === 'Enter') tryIt(); };
}
