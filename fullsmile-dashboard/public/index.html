<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Full Smile Dental | Practice report</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens from fullsmilechicago.com */
:root{--bg:#eef2fa;--card:#fff;--line:#dce8f4;--line2:#e8f0fa;--ink:#152449;--ink2:#25385c;--text:#1d2742;--text2:#51607a;--text3:#8491a7;
  --accent:#4da8d3;--cyan:#06aad7;--accbg:#eaf5fb;--good:#1f8a5b;--bad:#c24a33;--warn:#b7791f;--r:18px;--sh:0 10px 30px -18px rgba(21,36,73,.35);
  --font:'Urbanist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1{font-weight:700;letter-spacing:-.02em;color:var(--ink)}
h3{font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.cap{font-size:13px;color:var(--text3);margin-top:2px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent)}
/* shell */
#shell[hidden]{display:none}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px 20px}
.rb{padding:0 8px}.rb img{height:52px;width:auto;display:block}
.rb span{display:block;font-size:12px;font-weight:600;color:var(--text3);margin-top:10px;letter-spacing:.02em}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:4px}
.nav button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:none;text-align:left;padding:10px 12px;border-radius:12px}
.nav button b{display:block;font-weight:700;font-size:15.5px;color:var(--ink)}
.nav button small{display:block;font-size:12.5px;color:var(--text3)}
.nav button:hover{background:var(--bg)}
.nav button[aria-current="page"]{background:var(--accbg)}
.nav button[aria-current="page"] b{color:var(--accent)}
.badge{font-style:normal;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:10px;padding:1px 8px}
.rf{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--text3);display:grid;gap:6px}
.lk{background:none;border:none;color:var(--accent);text-align:left;padding:0;font-size:12.5px;font-weight:600}
.main{min-width:0;padding:28px 34px 48px;max-width:1260px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.top h1{font-size:clamp(26px,2.7vw,38px);line-height:1.12;margin-top:6px;max-width:30ch}
.top .tag{font-size:17px;color:var(--text2);margin-top:6px;font-weight:500}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{background:none;border:none;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--text2);border-radius:9px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}.c3{grid-column:span 3}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;min-width:0;border:1px solid rgba(220,232,244,.6)}
.top2{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}.top2>div:first-child{flex:1;min-width:0}.top2>.seg,.top2>button{flex:none}
.more{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700;padding:8px 14px;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:10px}
.more:hover{background:var(--accbg)}
.banner{background:#fff8eb;border:1px solid #f3dcae;color:#7a5314;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14.5px}
/* KPI band */
.navy{background:var(--ink);border-radius:var(--r);margin-bottom:16px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;text-align:left;background:none;border:none;color:#fff;padding:20px 20px 18px;border-left:1px solid rgba(255,255,255,.09);min-width:0;font:inherit}
.kpi:first-child{border-left:none}
button.kpi:hover{background:rgba(255,255,255,.04)}
.kpi b{font-size:clamp(24px,2.3vw,32px);font-weight:700;line-height:1.1;white-space:nowrap;letter-spacing:-.01em}
.kpi span{font-size:12.5px;font-weight:600;color:#9fd0e7;margin-top:6px}
.kpi em{font-style:normal;font-size:12.5px;margin-top:4px;color:#aab6cc;min-height:17px}.kpi em.good{color:#8fe0b5}.kpi em.bad{color:#ffb3a1}
.kpi svg{display:block;margin-top:10px;width:100%;height:26px}
/* bars and rows */
.b2{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px;width:100%;background:none;border:none;text-align:left}
.b2 .t{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}
.b2 .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.b2 .t i.n{background:var(--ink2)}.b2 .t i.u{background:#c7d3e3}
.b2 b{text-align:right;font-weight:700}
.b2.bt:hover span:first-child{color:var(--accent)}
.kv3{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:12px}
.kv3 b{display:block;font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.kv3 span{font-size:12.5px;color:var(--text3)}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.line:last-child{border-bottom:none}.line b{font-weight:700;color:var(--ink)}
/* channel table */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid rgba(220,232,244,.6)}
.ch-h,.ch-r{display:grid;grid-template-columns:minmax(170px,1.5fr) 84px 60px 66px 90px 96px 118px;gap:12px;align-items:center;padding:0 22px}
.ch-h{font-size:12px;font-weight:700;color:var(--text3);padding-top:14px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.ch-h .r,.ch-r .r{text-align:right}
.ch-r{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding-top:12px;padding-bottom:12px}
.ch-r:last-of-type{border-bottom:none}.ch-r:hover{background:#f7faff}
.ch-r .nm{font-weight:700;color:var(--ink)}.ch-r .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--text3)}
.ch-r .muted{color:var(--text3)}.ch-r .np{font-weight:700}
.ch-r .cost{text-align:right;font-size:20px;font-weight:800;color:var(--accent)}
.ch-r .cost small{display:block;font-size:11.5px;font-weight:500;color:var(--text3)}
.foot{padding:11px 22px 13px;font-size:13px;color:var(--text3);border-top:1px solid var(--line2);background:#fafcff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}
/* reputation */
.rk-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--text2)}
.rk-legend span{display:flex;gap:8px;align-items:baseline;min-width:0}
.rk-legend i{flex:none;width:14px;height:3px;border-radius:2px;display:inline-block;transform:translateY(-3px)}
.rk-legend b{font-weight:800;color:var(--ink);white-space:nowrap}
.rk-legend em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{color:var(--good)}.down{color:var(--bad)}
.stat2{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding:11px 0}
.stat2:last-child{border-bottom:none}
.stat2 .v{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat2 b{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.stat2 span{font-size:13px;color:var(--text2)}
.stat2 em,.ig4 em{font-style:normal;font-size:12.5px;font-weight:600}.good{color:var(--good)}.bad{color:var(--bad)}
.stat2 svg{display:block;width:100%;height:22px;margin-top:6px}
.ig4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0 4px}
.ig4 b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.ig4 span{display:block;font-size:12.5px;color:var(--text3)}
svg.mbars{display:block;width:100%;height:70px}
.post{display:grid;grid-template-columns:minmax(0,1fr) 64px 60px 110px;align-items:baseline;gap:0 12px;padding:8px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.post:last-child{border-bottom:none}.post:hover .pt{color:var(--accent)}
.post .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post .pd{font-size:12px;color:var(--text3)}
.post b{font-size:18px;font-weight:800;text-align:right;color:var(--ink)}.post > small{text-align:right;color:var(--text3);font-size:12px}
/* attention */
.att{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit;border-top:4px solid var(--accent)}
.att.hot{border-top-color:var(--bad)}.att.warn{border-top-color:var(--warn)}
.att:hover{background:#fbfdff}
.att b{font-size:19px;font-weight:800;line-height:1.25;color:var(--ink)}
.att p{font-size:14px;color:var(--text2);margin:0}
.att .go2{font-size:13px;color:var(--accent);font-weight:700;margin-top:auto;padding-top:8px}
/* sidebar */
#scrim{position:fixed;inset:0;background:rgba(21,36,73,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#side{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--card);visibility:hidden;transform:translateX(100%);transition:transform .22s;z-index:31;overflow-y:auto}
body.open #scrim{opacity:1;pointer-events:auto}body.open #side{transform:none;visibility:visible;box-shadow:-20px 0 50px -30px rgba(21,36,73,.5)}
.sh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;gap:12px;align-items:flex-start}
.sh .t{flex:1;min-width:0}.sh h2{font-size:24px;font-weight:800;color:var(--ink);line-height:1.15}.sh .k{font-size:13.5px;color:var(--text3);margin-top:3px}
.sh button{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;flex:none}.sh .x{width:34px}.sh .back{padding:0 11px;font-size:13px}
.sb{padding:6px 24px 44px}
.read{margin-top:16px;font-size:16px;line-height:1.6}
.sb h4{font-size:17px;font-weight:800;color:var(--ink);margin:24px 0 8px}
.sb p.s{font-size:14px;color:var(--text2);margin:6px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.kv div{background:var(--bg);border-radius:12px;padding:12px 14px}
.kv b{display:block;font-size:22px;font-weight:800;color:var(--ink);line-height:1.2}.kv span{font-size:12.5px;color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:700;color:var(--text3);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line2);color:var(--text2)}td:first-child{color:var(--ink);font-weight:600}
.n{text-align:right;white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td{background:#f7faff}
/* lock */
#lock{max-width:380px;margin:14vh auto 0;padding:0 24px;text-align:center}
#lock img{height:88px}#lock h1{margin:22px 0 6px;font-size:28px}#lock p{color:var(--text2)}
#lock input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;width:100%;margin:22px 0 12px;background:#fff;text-align:center}
#lock .go{width:100%;font-weight:700;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px}
.err{color:var(--bad);font-size:14px;margin-top:10px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:none}.kpi:nth-child(n+4){border-top:1px solid rgba(255,255,255,.09)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto}
  .rb img{height:32px}.rb span{display:none}.rf{display:none}
  .nav{flex-direction:row;margin:0}.nav button{padding:8px 10px;white-space:nowrap}.nav button small{display:none}
  .main{padding:18px 14px 40px}.top{flex-direction:column}
  .c8,.c4,.c6,.c3{grid-column:span 12}.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}.kpi{border-left:none !important;border-top:1px solid rgba(255,255,255,.09)}.kpi:nth-child(-n+2){border-top:none}
  .ch-h{display:none}.ch-r{grid-template-columns:1fr auto;row-gap:4px}.ch-r .hide{display:none}
  .ig4{grid-template-columns:1fr 1fr}.rk-legend{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#scrim,#side{transition:none}}
</style>
</head>
<body>
<div id="gate"><div id="lock"><p>Loading…</p></div></div>
<div id="shell" class="shell" hidden>
  <aside class="rail">
    <div class="rb"><img src="fullsmile-logo.png" alt="Full Smile Dental"><span>Practice report</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rf"><span id="upd"></span><button class="lk" data-about="1">About these numbers</button></div>
  </aside>
  <main class="main">
    <div class="top"><div id="vhead"></div><div class="seg" id="win" role="group" aria-label="Date range"></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim"></div>
<aside id="side" aria-hidden="true" aria-labelledby="st"><div class="sh"><button class="back" id="sback" hidden>Back</button><div class="t"><h2 id="st"></h2><div class="k" id="sk"></div></div><button class="x" id="sx" aria-label="Close">✕</button></div><div class="sb" id="sbody"></div></aside>

<script>
// ---------- helpers
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const $ = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n || 0)).toLocaleString();
const $k = n => (n >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : n >= 1e5 ? `$${Math.round(n / 1e3)}K` : $(n));
const n0 = v => (v == null ? '—' : Math.round(v).toLocaleString());
const pct = v => (v == null || isNaN(v) ? '—' : `${Math.round(v * 100)}%`);
const dl = d => { if (!d) return '—'; const [, m, dd] = d.split('-'); return `${MO[+m - 1]} ${+dd}`; };
const shift = (d, n) => { const x = new Date(`${d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const monday = d => { const x = new Date(`${d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10); };
const pl = (n, a, b) => `${Math.round(n).toLocaleString()} ${Math.round(n) === 1 ? a : (b || a + 's')}`;
const sum = (a, f) => a.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f] || 0), 0);
const per = (a, b) => (a && b ? a / b : null);
const median = a => { const v = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); return v.length ? v[Math.floor(v.length / 2)] : null; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

const CHS = [
  ['meta', 'Meta ads', true, '#4da8d3'], ['lsa', 'Google LSA', true, '#152449'], ['google_ads', 'Google Search Ads', true, '#3e5a8c'],
  ['gbp', 'Google profile', false, '#06aad7'], ['website', 'Website', false, '#8fcbe6'], ['google_any', 'Google (from OpenDental)', false, '#7d93b8'],
  ['referral', 'Referrals and word of mouth', false, '#2f8f9d'], ['phone', 'Phone call, source unknown', false, '#b4c2d6'],
  ['other', 'Other', false, '#cfd8e6'], ['unknown', 'No source recorded', false, '#dde4ee'], ['not_in_ghl', 'Not in GHL', false, '#e6ebf2'],
];
const CH = Object.fromEntries(CHS.map(([k, label, paid, color]) => [k, { k, label, paid, color }]));
const chLabel = k => CH[k]?.label || k;
const CATS = { prev: 'Exams and cleanings', perio: 'Deep cleaning and gum care', fill: 'Fillings', crown: 'Crowns and bridges', endo: 'Root canals', implant: 'Implants', denture: 'Dentures', surgery: 'Extractions and surgery', sleep: 'Sleep apnea', ortho: 'Orthodontics', other: 'Other' };

let D;
const S = { win: 30, tab: 'practice', gran: 'week', stack: [] };
const P = () => D.practice;

// ---------- unlock
async function decrypt(pkg, pass) {
  const enc = new TextEncoder(), b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(pkg.salt), iterations: pkg.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(pkg.iv) }, key, b(pkg.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function boot() {
  let pkg;
  try { const r = await fetch('data.json', { cache: 'no-store' }); if (r.ok) return start(await r.json()); } catch {}
  try { const r = await fetch('data.enc.json', { cache: 'no-store' }); if (!r.ok) throw 0; pkg = await r.json(); } catch { return fail('The dashboard data is not published yet. Check the GitHub Actions run.'); }
  const saved = sessionStorage.getItem('fsk');
  if (saved) { try { return start(await decrypt(pkg, saved)); } catch { sessionStorage.removeItem('fsk'); } }
  el('gate').innerHTML = `<div id="lock"><img src="fullsmile-logo.png" alt="Full Smile Dental"><h1>Practice report</h1><p>Enter the password to open the dashboard.</p>
    <input id="pw" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password" autofocus><button class="go" id="go">Open dashboard</button><p class="err" id="err" role="alert"></p></div>`;
  const tryIt = async () => { try { const d = await decrypt(pkg, el('pw').value); sessionStorage.setItem('fsk', el('pw').value); start(d); } catch { el('err').textContent = 'That password did not work. Check it and try again.'; } };
  el('go').onclick = tryIt; el('pw').onkeydown = e => { if (e.key === 'Enter') tryIt(); };
}
const fail = m => (el('gate').innerHTML = `<div id="lock"><p class="err">${esc(m)}</p></div>`);
function start(data) {
  D = data;
  el('win').innerHTML = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, '12 months']].map(([k, t]) => `<button data-win="${k}">${t}</button>`).join('');
  el('upd').textContent = `Updated ${dl(D.today)}`;
  el('gate').hidden = true; el('shell').hidden = false;
  readTab(); render();
  addEventListener('hashchange', () => { readTab(); render(); scrollTo(0, 0); });
}

// ---------- ranges
function range() { return [shift(D.today, -S.win), shift(D.today, -1)]; }
function prior() { const [a] = range(); return [shift(a, -S.win), shift(a, -1)]; }
const rangeWords = () => (S.win === 365 ? 'in the last 12 months' : `in the last ${S.win} days`);
const priorWords = () => (S.win === 365 ? 'the 12 months before' : `the ${S.win} days before`);
const winLabel = () => (S.win === 365 ? 'Last 12 months' : `Last ${S.win} days`);
const inR = (d, r) => d >= r[0] && d <= r[1];
// Patient-linked numbers come from the droplet by week (no single-day detail). A week counts when its Monday falls in the range.
const wkIn = (wk, r) => wk >= monday(r[0]) && wk <= r[1] && wk >= shift(r[0], -3);

function delta(cur, prev, lowerBetter, count) {
  if (cur == null || prev == null) return '';

  if (!prev) return '';
  const ch = (cur - prev) / prev; if (Math.abs(ch) < 0.03) return `<em>Flat vs ${priorWords()}</em>`;
  return `<em class="${(ch < 0) === !!lowerBetter ? 'good' : 'bad'}">${ch > 0 ? '▲' : '▼'} ${Math.round(Math.abs(ch) * 100)}% vs ${priorWords()}</em>`;
}
function kspark(vals, color = '#9fd0e7', w = 160, h = 26) {

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${v.map((x, i) => `${(i * step).toFixed(1)},${y(x)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---------- practice numbers
function practiceIn(r) {
  const p = P(); if (!p) return null;
  const Dd = p.practice.daily.filter(x => inR(x[0], r));
  const np = p.newPatients.filter(x => wkIn(x[0], r));
  const done = sum(Dd, x => x[4]), broken = sum(Dd, x => x[5]);
  return { prod: sum(Dd, x => x[1]), coll: sum(Dd, x => x[2] + x[3]), done, broken, show: done + broken ? done / (done + broken) : null, np: sum(np, x => x[3]), npColl: sum(np, x => x[4]), npRows: np };
}
function channelsIn(r) {
  const p = P(), out = {};
  const get = k => (out[k] ||= { k, spend: 0, leads: 0, booked: 0, np: 0, coll: 0, plan: 0 });
  for (const [d, ch, amt] of D.spend) if (inR(d, r)) get(ch).spend += amt;
  if (p) {
    for (const [wk, ch, n, booked] of p.leads.weeks) if (wkIn(wk, r)) { get(ch).leads += n; get(ch).booked += booked; }
    for (const [wk, ch, , n, coll, , plan] of p.newPatients) if (wkIn(wk, r)) { const x = get(ch); x.np += n; x.coll += coll; x.plan += plan; }
  }
  return Object.values(out).map(x => ({ ...x, ...CH[x.k], cpnp: x.spend && x.np ? x.spend / x.np : null, cpl: x.spend && x.leads ? x.spend / x.leads : null }))
    .filter(x => x.spend || x.leads || x.np).sort((a, b) => (b.paid - a.paid) || (b.np - a.np) || (b.leads - a.leads));
}

const RKC = ['#152449', '#4da8d3', '#06aad7', '#3e5a8c', '#9aa9c0'];
function rankChart() {
  const T = (D.gsc.tracked || []).filter(x => D.gsc.series?.[x.q]), weeks = D.gsc.weeks || [];
  if (!T.length || weeks.length < 2) return '<p class="cap" style="margin-top:10px">Not enough ranking history yet.</p>';
  const top = [...T].sort((a, b) => b.i - a.i).slice(0, 5), Wd = 640, H = 150, padL = 34, padR = 10;
  const worst = Math.max(12, ...top.flatMap(k => D.gsc.series[k.q].p.filter(v => v != null))), hi = Math.min(100, Math.ceil((worst + 2) / 10) * 10);
  const yOf = v => 8 + (Math.min(Math.max(v, 1), hi) - 1) / (hi - 1) * (H - 16), xOf = i => padL + i / (weeks.length - 1) * (Wd - padL - padR);

  const ticks = [1, ...Array.from({ length: Math.floor(hi / (hi > 60 ? 20 : 10)) }, (_, i) => (i + 1) * (hi > 60 ? 20 : 10))];
  for (const v of ticks) s += `<line x1="${padL}" x2="${Wd - padR}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="#e8f0fa"/><text x="${padL - 6}" y="${yOf(v) + 4}" text-anchor="end" font-size="10.5" fill="#8491a7" font-family="Urbanist">#${v}</text>`;
  top.forEach((k, i) => { const pts = D.gsc.series[k.q].p.map((v, j) => (v == null ? null : [xOf(j), yOf(v)])).filter(Boolean);
    if (pts.length > 1) s += `<polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${RKC[i]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    const l = pts[pts.length - 1]; if (l) s += `<circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="${RKC[i]}"/>`; });
  [0, Math.floor((weeks.length - 1) / 2), weeks.length - 1].forEach(j => s += `<text x="${xOf(j)}" y="${H + 16}" text-anchor="${j === 0 ? 'start' : j === weeks.length - 1 ? 'end' : 'middle'}" font-size="11" fill="#8491a7" font-family="Urbanist">${dl(weeks[j])}</text>`);
  return s + `</svg><div class="rk-legend">${top.map((k, i) => { const d = k.prev != null && k.pos != null ? k.prev - k.pos : null;
    return `<span><i style="background:${RKC[i]}"></i><b>${k.pos == null ? '—' : '#' + Math.round(k.pos)}</b><em title="${esc(k.q)}">${esc(k.q)}</em>${d != null && Math.abs(d) >= 0.5 ? `<b class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(0)}</b>` : ''}</span>`; }).join('')}</div>`;
}

      <div class="ig4"><div><b>${n0(ig.followers)}</b><span>Followers${newF ? `, +${newF} in 30 days` : ''}</span></div><div><b>${n0(views)}</b><span>Views</span>${cover ? ch(views, sum(Dp, x => x[3])) : ''}</div>
      <div><b>${n0(inter)}</b><span>Likes, comments, shares</span>${cover ? ch(inter, sum(Dp, x => x[4])) : ''}</div><div><b>${posts.length}</b><span>Posts</span></div></div>
      ${ms.length > 1 ? `<p class="cap" style="margin:12px 0 2px">Views by month</p><svg class="mbars" viewBox="0 0 600 70" preserveAspectRatio="none">${ms.map(([k, v], i) => `<rect x="${i * bw + bw * .18}" y="${54 - v / mmx * 50}" width="${bw * .64}" height="${v / mmx * 50}" rx="3" fill="${i === ms.length - 1 ? '#152449' : '#4da8d3'}"><title>${MO[+k.slice(5) - 1]}: ${n0(v)} views</title></rect><text x="${i * bw + bw / 2}" y="68" text-anchor="middle" font-size="10" fill="#8491a7" font-family="Urbanist">${MO[+k.slice(5) - 1]}</text>`).join('')}</svg>` : ''}
      ${top.length ? `<p class="cap" style="margin:10px 0 2px">Top posts</p>${top.map(x => `<a class="post" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="pt">${esc(x.cap || 'Post')}</span><span class="pd">${dl(x.d)}</span><b>${n0(x.reach)}</b><small>${x.reach >= med * 2 ? `reached, ${(x.reach / med).toFixed(0)}× usual` : 'reached'}</small></a>`).join('')}` : `<p class="cap" style="margin-top:10px">No posts ${rangeWords()}.</p>`}</div>`;
  }
  const almost = [...T.filter(x => x.pos > 10.5 && x.pos <= 20.5), ...(D.gsc.almost || []).filter(x => !T.some(t => t.q === x.q))].slice(0, 6);
  const near = `<div class="c4 card"><h3>Almost on page one</h3><p class="cap">Searches ranking 11 to 20, the cheapest wins next.</p>
    ${almost.length ? almost.map(x => `<div class="line"><span>${esc(x.q)}</span><b>#${Math.round(x.pos)}</b></div>`).join('') : '<p class="cap" style="margin-top:10px">None right now.</p>'}</div>`;
  return [head, tag, `<div class="grid">${rank}${prof}${social}${near}</div>`];
}

// ----- Attention
function attentionItems() {
  const items = [], p = P(), wt = p?.leads.waiting || {}, snap = p?.practice.snapshot || {};
  if (wt.untouched) items.push(['hot', `${pl(wt.untouched, 'lead')} not contacted after a day`, 'New leads from the last 30 days still in the first stage in GHL.', 'data-ghl="1"', 'Open GHL']);
  if (wt.noShowNotRebooked || snap.brokenNotRebooked) items.push(['warn', `${pl((wt.noShowNotRebooked || 0) + (snap.brokenNotRebooked || 0), 'missed visit')} not rebooked`, `${n0(snap.brokenNotRebooked || 0)} broken appointments in OpenDental and ${n0(wt.noShowNotRebooked || 0)} lead no-shows in GHL, last 60 days.`, 'data-ghl="1"', 'Open GHL']);
  if (snap.unschedAmount) items.push(['', `${$k(snap.unschedAmount)} of treatment not scheduled`, `${pl(snap.unschedPatients, 'patient')} with planned treatment and no appointment, last 18 months.`, 'data-side="production"', 'See production']);
  if (snap.recallOverdue) items.push(['', `${pl(snap.recallOverdue, 'patient')} overdue for a cleaning`, `Recall due in the last 18 months and not booked. ${n0(snap.recallDue30)} more are due within 30 days.`, 'data-tab="practice"', 'See the schedule']);
  if (wt.contactedNotBooked) items.push(['', `${pl(wt.contactedNotBooked, 'lead')} contacted but not booked`, 'Reached in the last 30 days with no appointment yet.', 'data-ghl="1"', 'Open GHL']);
  const lowRev = D.gbp.reviews.list.filter(x => x[1] && x[1] <= 3 && x[0] >= shift(D.today, -90));
  if (lowRev.length) items.push(['warn', `${pl(lowRev.length, 'low review')} in the last 90 days`, `Most recent: ${lowRev[lowRev.length - 1][1]} stars on ${dl(lowRev[lowRev.length - 1][0])}. A reply on Google helps.`, 'data-tab="reputation"', 'See reputation']);
  const ym = D.today.slice(0, 7), lastYm = shift(`${ym}-01`, -1).slice(0, 7);
  if (D.lsa.lastMonth && D.lsa.lastMonth < lastYm) items.push(['warn', 'LSA spend not entered', `The last month entered is ${MO[+D.lsa.lastMonth.slice(5) - 1]}. Add ${MO[+lastYm.slice(5) - 1]} to data/lsa-spend.json.`, 'data-about="1"', 'Details']);
  if (D.lsa.cap) { const mtd = sum(D.spend.filter(x => x[1] === 'lsa' && x[0].startsWith(ym)), x => x[2]); if (mtd > D.lsa.cap * 0.8) items.push(['hot', `LSA at ${pct(mtd / D.lsa.cap)} of its monthly cap`, `${$(mtd)} of ${$(D.lsa.cap)} this month.`, 'data-ch="lsa"', 'See LSA']); }
  return items;
}
function attentionTab() {
  const items = attentionItems(), p = P(), top = items.slice(0, 4);
  const head = items.length ? `${pl(items.length, 'thing')} worth a look this week.` : 'Nothing needs attention right now.';
  const tag = p ? `${n0(p.leads.waiting.untouched)} leads waiting on a first call. ${n0(p.practice.snapshot.recallOverdue)} patients overdue for a cleaning.` : '';
  const cards = top.length ? `<div class="grid">${top.map(([cl, t, d, attr, go]) => `<button class="card att ${cl} c${12 / top.length}" ${attr}><b>${esc(t)}</b><p>${esc(d)}</p><span class="go2">${go}</span></button>`).join('')}</div>` : '';
  const rest = items.slice(4);
  const stages = p ? p.leads.openStages.slice(0, 8) : [], smx = Math.max(1, ...stages.map(x => x[1]));
  const q = p?.quality;
  const pipe = `<div class="c6 card"><h3>GHL pipeline right now</h3><p class="cap">Open opportunities by stage. Names stay in GHL.</p>
    <div style="margin-top:8px">${stages.map(([n, c]) => `<div class="b2"><span>${esc(n)}</span><span class="t"><i style="width:${c / smx * 100}%"></i></span><b>${c}</b></div>`).join('') || '<p class="cap">Appears after the droplet runs.</p>'}</div>
    ${D.ghlUrl ? `<a class="more" href="${esc(D.ghlUrl)}" target="_blank" rel="noopener">Open in GHL</a>` : ''}</div>`;
  const health = `<div class="c6 card"><h3>Data health</h3><p class="cap">How well leads and patients line up across GHL and OpenDental, last 13 months.</p>
    ${q ? `<div class="line"><span>New patients matched to their GHL lead</span><b>${n0(q.patnum + q.phone + q.email)}</b></div>
      <div class="line"><span>Matched by OpenDental patient ID</span><b>${n0(q.patnum)}</b></div>
      <div class="line"><span>Source from the OpenDental referral field</span><b>${n0(q.odReferral)}</b></div>
      <div class="line"><span>New patients with no source anywhere</span><b>${n0(q.none)}</b></div>
      <div class="line"><span>Synced existing-patient contacts left out of lead counts</span><b>${n0(q.syncContactsExcluded)}</b></div>` : '<p class="cap" style="margin-top:10px">Appears after the droplet runs.</p>'}
    ${rest.map(([, t, d]) => `<div class="line"><span>${esc(t)}</span></div>`).join('')}</div>`;
  return [head, tag, `${cards}<div class="grid" style="margin-top:16px">${pipe}${health}</div>`];
}

// ---------- sidebars (totals only; no patient names anywhere)
const tbl = (head, rows, attrs) => `<table><thead><tr>${head.map(h => (Array.isArray(h) ? `<th class="n">${h[0]}</th>` : `<th>${h}</th>`)).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr ${attrs ? attrs[i] || '' : ''}>${r.map((c, j) => `<td class="${Array.isArray(head[j]) ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const kv = items => `<div class="kv">${items.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
function sideChannel(k) {
  const r = range(), x = channelsIn(r).find(y => y.k === k) || { k, ...CH[k], spend: 0, leads: 0, booked: 0, np: 0, coll: 0, plan: 0 }, p = P();
  el('st').textContent = chLabel(k); el('sk').textContent = rangeWords()[0].toUpperCase() + rangeWords().slice(1);
  const read = [x.leads ? `${pl(x.leads, 'lead')}, ${x.booked} booked a visit.` : '', x.np ? `${pl(x.np, 'new patient')} had a first visit, and they have paid ${$(x.coll)} so far${x.plan ? ` with ${$(x.plan)} more treatment planned` : ''}.` : 'No new patients in this period yet.', x.paid && x.spend ? `${$(x.spend)} spent${x.cpnp ? `, ${$(x.cpnp)} per new patient` : ''}.` : ''].filter(Boolean).join(' ');
  let h = `<p class="read">${esc(read)}</p>${kv([[x.paid ? $(x.spend) : 'Free', 'Spent'], [n0(x.leads), 'Leads'], [n0(x.booked), 'Booked'], [n0(x.np), 'New patients'], [$(x.coll), 'Collected from them'], [x.cpnp ? $(x.cpnp) : '—', 'Per new patient']])}`;
  if (p) { const W = weeks12(); h += `<h4>By week</h4>${tbl(['Week of', ['Leads', 1], ['Booked', 1], ['New patients', 1], ['Collected', 1]], W.slice().reverse().map(([a]) => { const L = p.leads.weeks.filter(y => y[0] === a && y[1] === k), N = p.newPatients.filter(y => y[0] === a && y[1] === k); return [dl(a), sum(L, y => y[2]) || '—', sum(L, y => y[3]) || '—', sum(N, y => y[3]) || '—', sum(N, y => y[4]) ? $(sum(N, y => y[4])) : '—']; }))}`; }
  if (k === 'meta') {
    const m = {}; for (const [d, ad, s, l, c] of D.meta.rows) if (inR(d, r)) { const t = (m[ad] ||= { s: 0, l: 0, c: 0 }); t.s += s; t.l += l; t.c += c; }
    const rows = Object.entries(m).filter(([, t]) => t.s).sort((a, b) => b[1].s - a[1].s);
    h += `<h4>By ad</h4>${rows.length ? tbl(['Ad', ['Spent', 1], ['Form leads', 1], ['Per lead', 1]], rows.map(([ad, t]) => [`${esc(D.meta.ads[ad]?.name || ad)}<br><span style="font-size:12px;color:var(--text3);font-weight:500">${esc(D.meta.ads[ad]?.campaign || '')}</span>`, $(t.s), t.l || '—', t.l ? $(t.s / t.l) : '—'])) : '<p class="s">No Meta spend in this period.</p>'}
      <p class="s">Form leads are Meta's count. Leads above come from GHL, so the two can differ.</p>`;
  }
  if (k === 'google_ads') {
    const m = {}; for (const [d, c, s, cl, cv] of D.gads) if (inR(d, r)) { const t = (m[c] ||= { s: 0, cl: 0, cv: 0 }); t.s += s; t.cl += cl; t.cv += cv; }
    const rows = Object.entries(m).sort((a, b) => b[1].s - a[1].s);
    h += `<h4>Campaigns</h4>${rows.length ? tbl(['Campaign', ['Spent', 1], ['Clicks', 1], ['Conversions', 1]], rows.map(([c, t]) => [esc(c), $(t.s), n0(t.cl), n0(t.cv)])) : '<p class="s">No Search Ads spend in this period. Search campaigns have been paused since June.</p>'}`;
  }
  if (k === 'lsa') {
    const mo = {}; for (const [d, ch, a] of D.spend) if (ch === 'lsa') mo[d.slice(0, 7)] = (mo[d.slice(0, 7)] || 0) + a;
    h += `<h4>Spend by month</h4>${tbl(['Month', ['Spent', 1]], Object.entries(mo).sort().reverse().map(([m, a]) => [`${MO[+m.slice(5) - 1]} ${m.slice(0, 4)}`, $(a)]))}
      <p class="s">LSA spend is entered by hand from the LSA dashboard (data/lsa-spend.json), because it is billed outside the Google Ads account Windsor reads. LSA bills when a payment threshold is reached, so a month can look spiky.${D.lsa.cap ? ` Monthly cap: ${$(D.lsa.cap)}.` : ''}</p>`;
  }
  el('sbody').innerHTML = h;
}
function sideNew() {
  const r = range(), T = practiceIn(r), p = P();
  el('st').textContent = 'New patients'; el('sk').textContent = `${pl(T.np, 'patient')} ${rangeWords()}`;
  const by = {}; for (const x of T.npRows) { const t = (by[x[1]] ||= { n: 0, c: 0, pr: 0, pl: 0 }); t.n += x[3]; t.c += x[4]; t.pr += x[5]; t.pl += x[6]; }
  const rows = Object.entries(by).sort((a, b) => b[1].n - a[1].n);
  el('sbody').innerHTML = `<p class="read">${pl(T.np, 'new patient')} had a first visit ${rangeWords()}. They have paid ${$(sum(rows, x => x[1].c))} so far, and ${$(sum(rows, x => x[1].pl))} more treatment is planned for them.</p>
    ${tbl(['Source', ['Patients', 1], ['Collected', 1], ['Planned', 1]], rows.map(([k, t]) => [esc(chLabel(k)), t.n, $(t.c), $(t.pl)]), rows.map(([k]) => `class="go" data-ch="${k}"`))}
    <p class="s">Counted by the week of the first visit in OpenDental. Patient names never leave the practice's systems.</p>`;
}
function sideProduction() {
  const r = range(), p = P(); if (!p) return;
  el('st').textContent = 'Production'; el('sk').textContent = rangeWords()[0].toUpperCase() + rangeWords().slice(1);
  const cat = {}; for (const [w2, c, a, n] of p.practice.prodCat) if (wkIn(w2, r)) { const t = (cat[c] ||= { a: 0, n: 0 }); t.a += a; t.n += n; }
  const rows = Object.entries(cat).sort((a, b) => b[1].a - a[1].a), snap = p.practice.snapshot;
  el('sbody').innerHTML = `<p class="read">${$(sum(rows, x => x[1].a))} of completed treatment ${rangeWords()}. ${snap.unschedAmount ? `Another ${$(snap.unschedAmount)} is planned for ${pl(snap.unschedPatients, 'patient')} but not scheduled.` : ''}</p>
    ${tbl(['Service', ['Procedures', 1], ['Production', 1]], rows.map(([c, t]) => [esc(CATS[c] || c), n0(t.n), $(t.a)]))}
    <p class="s">Services are grouped by CDT code: implants are D6000s, crowns D2700s, sleep apnea appliances D9947 to D9949.</p>`;
}
function sideSearches() {
  el('st').textContent = 'Google searches'; el('sk').textContent = `Search Console, ${dl(D.gsc.window[0])} to ${dl(D.gsc.window[1])}`;
  const T = D.gsc.tracked || [], top = D.gsc.top || [];
  el('sbody').innerHTML = `<h4>Tracked local searches</h4>${tbl(['Search', ['Rank', 1], ['Change', 1], ['Seen', 1]], T.map(x => [esc(x.q), x.pos == null ? 'Not yet' : `#${Math.round(x.pos)}`, x.pos != null && x.prev != null ? `<span class="${x.prev - x.pos >= 0 ? 'up' : 'down'}">${x.prev - x.pos >= 0 ? '▲' : '▼'}${Math.abs(x.prev - x.pos).toFixed(1)}</span>` : '—', n0(x.i)]))}
    <h4>Searches bringing the most visits</h4>${tbl(['Search', ['Rank', 1], ['Visits', 1], ['Seen', 1]], top.slice(0, 20).map(x => [esc(x.q), x.pos ? `#${Math.round(x.pos)}` : '—', n0(x.c), n0(x.i)]))}`;
}
function sideInstagram() {
  const P2 = D.ig?.posts || [], med = median(P2.map(p => p.reach)) || 1;
  el('st').textContent = 'Instagram posts'; el('sk').textContent = `${P2.length} posts in the last 12 months`;
  el('sbody').innerHTML = `<p class="read">A typical post reaches about ${n0(med)} people.</p>${tbl(['Post', ['Reached', 1], ['Views', 1], ['Shares', 1]], P2.map(p => [`${esc(p.cap || 'Post')}<br><span style="font-size:12px;color:var(--text3);font-weight:500">${dl(p.d)}, <a href="${esc(p.url)}" target="_blank" rel="noopener">open</a></span>`, n0(p.reach), n0(p.views), p.shares || '—']))}`;
}
function sideAbout() {
  el('st').textContent = 'About these numbers'; el('sk').textContent = `Refreshed ${new Date(D.generatedAt).toLocaleString()}`;
  el('sbody').innerHTML = `<p class="read">Patients, visits, production and collections come from OpenDental. Leads come from GHL. Ad spend comes from Meta and Google Ads, and LSA spend is entered monthly. Reviews, calls and rankings come from Google, and posts from Instagram.</p>
    <p class="s">Patient details never leave the practice's server. The droplet sends only totals by day or week, so this page holds no names, phone numbers or visit records.</p>
    <p class="s">Collected is insurance payments plus patient payments. Write-offs are not counted. Cost per new patient is ad spend only.</p>
    ${D.notes.map(t => `<p class="s">${esc(t)}</p>`).join('')}`;
}
const sideView = v => (v.ch ? sideChannel(v.ch) : v.side === 'newpatients' ? sideNew() : v.side === 'production' ? sideProduction() : v.side === 'searches' ? sideSearches() : v.side === 'instagram' ? sideInstagram() : sideAbout());
function openSide(v, push) {
  if (push) S.stack.push(v); else S.stack = [v];
  el('sback').hidden = S.stack.length < 2; sideView(v);
  document.body.classList.add('open'); el('side').setAttribute('aria-hidden', 'false'); el('side').scrollTop = 0; el('sx').focus();
}
function closeSide() { document.body.classList.remove('open'); el('side').setAttribute('aria-hidden', 'true'); S.stack = []; }
el('sx').onclick = closeSide; el('scrim').onclick = closeSide;
el('sback').onclick = () => { S.stack.pop(); const v = S.stack[S.stack.length - 1]; if (v) { el('sback').hidden = S.stack.length < 2; sideView(v); } };
addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-win],[data-tab],[data-ch],[data-side],[data-about],[data-ghl]'); if (!t) return;
  const d = t.dataset, inside = !!t.closest('#side');
  if (d.win) { S.win = +d.win; render(); if (S.stack.length) sideView(S.stack[S.stack.length - 1]); }
  else if (d.tab) { closeSide(); if (location.hash === '#' + d.tab) render(); else location.hash = d.tab; }
  else if (d.ch) openSide({ ch: d.ch }, inside);
  else if (d.side) openSide({ side: d.side }, inside);
  else if (d.about) openSide({ about: 1 }, false);
  else if (d.ghl) { if (D.ghlUrl) open(D.ghlUrl, '_blank', 'noopener'); else openSide({ about: 1 }, false); }
});
boot();
</script>
